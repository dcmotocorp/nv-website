name: Deploy to GitHub Pages

# Manual trigger only. GitHub Actions is currently blocked on this account for
# billing reasons, so the site is published from the committed docs/ folder
# instead (Settings -> Pages -> Deploy from a branch: main / docs).
#
# Once Actions billing is sorted, switch Pages back to "GitHub Actions" and
# restore the push trigger below to deploy straight from source.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress production deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Requires Settings -> Pages -> Source = "GitHub Actions".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
